<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>北海道 2026｜旅伴互動行程地圖</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#263238;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:24px 16px 40px}.hero{padding:8px 4px 20px}.hero h1{margin:0;font-size:28px}.hero p{color:#6b7280;margin:7px 0 0}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.tabs button{flex:0 0 auto;background:white;border:1px solid #dce3df;border-radius:13px;padding:10px 14px;text-align:left;cursor:pointer}.tabs button.active{background:#e5eeea;border-color:#9eb4aa}.tabs small{display:block;color:#78847f;font-size:11px}.tabs strong{font-size:13px}
.grid{display:grid;grid-template-columns:1.3fr .8fr;gap:14px}.card{background:#fff;border:1px solid #e0e6e3;border-radius:18px;padding:15px}.card h2{font-size:18px;margin:0 0 4px}.sub{font-size:13px;color:#71807a;margin:0 0 12px}
.map{background:#eef3f0;border-radius:14px;overflow:hidden}.map svg{width:100%;display:block}.land{fill:#dfe9e3;stroke:#b8c8bf;stroke-width:2}.route{fill:none;stroke:#899b94;stroke-width:3;stroke-dasharray:8 7}.marker{cursor:pointer}.marker circle{stroke:white;stroke-width:3}.marker text{font-size:11px;font-weight:600;fill:#263238;paint-order:stroke;stroke:#eef3f0;stroke-width:4px}
.timeline{max-height:580px;overflow:auto}.stop{width:100%;display:grid;grid-template-columns:58px 12px 1fr;gap:8px;text-align:left;border:0;background:none;padding:9px 6px;border-radius:11px;cursor:pointer;color:inherit}.stop:hover,.stop.active{background:#f0f4f2}.time{font-size:11px;color:#7b8581;padding-top:2px}.dot{width:9px;height:9px;border-radius:50%;background:#718a80;margin-top:5px;position:relative}.dot:after{content:"";position:absolute;width:1px;height:42px;background:#ccd6d1;left:4px;top:9px}.stop:last-child .dot:after{display:none}.stop strong{font-size:13px}.stop span{display:block;font-size:11px;color:#71807a;line-height:1.5;margin-top:2px}.detail{margin-top:12px;padding-top:12px;border-top:1px solid #e3e8e5;font-size:12px;line-height:1.65;color:#56635e}
.note{font-size:11px;color:#7a8580;margin-top:9px}.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:11px;border:1px solid #dce3df;border-radius:99px;padding:4px 8px;background:#fff;color:#64706b}
@media(max-width:760px){.grid{grid-template-columns:1fr}.timeline{max-height:none}.hero h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><h1>北海道 2026・旅伴互動行程地圖</h1><p>10/14（三）～10/19（一）｜函館・大沼・札幌・美瑛・小樽</p></header>
<div class="tabs" id="tabs"></div>
<div class="grid">
<section class="card">
<h2 id="title"></h2><p class="sub" id="sub"></p>
<div class="map"><svg viewBox="0 0 760 500" role="img" aria-label="當日行程示意地圖">
<path class="land" d="M110 92 C170 50 258 45 323 77 C390 44 479 57 553 101 C622 143 680 198 655 252 C636 295 576 287 552 331 C521 388 468 424 396 419 C334 415 297 454 233 425 C182 402 165 358 125 335 C83 310 57 263 73 217 C88 177 72 122 110 92Z"/>
<g id="routes"></g><g id="markers"></g>
<text x="535" y="465" fill="#72807a" font-size="10">行程動線示意・非導航路線</text>
</svg></div>
<div class="legend" id="legend"></div>
<p class="note">地圖主要用來理解「先去哪裡、再去哪裡」；城市內實際交通請以 Google Maps／乘換案內當日資訊為準。</p>
</section>
<section class="card">
<h2 style="font-size:16px">當日時間軸</h2>
<p class="sub" id="summary"></p><div class="timeline" id="timeline"></div><div class="detail" id="detail">點選行程查看詳細資訊。</div>
</section>
</div></div>
<script>
const days=[
{date:"10/14（三）",name:"歷史街區與百萬夜景",sub:"函館機場 → 五稜郭 → 元町・金森倉庫 → 函館山夜景",p:[
["11:30","函館機場","抵達函館機場、提領行李出關、國內線一樓大廳服務中心買函館特級套票","airport",240,395],
["12:30","HOTEL MYSTAYS 函館五稜郭","搭帝產巴士直達飯店門口放行李，後搭市電前往JR函館站","hotel",275,355],
["13:30","（備案）JR 函館車站","綠色窗口/遊客中心買函館特級套票","transit",230,315],
["14:00","2號或5號電車","搭乘市電前往「十字街站」","transit",180,280],
["14:30","幸運小丑漢堡 碼頭末廣店","遲來的午餐","food",150,265],
["15:00","金森紅磚倉庫 & 八幡坂","慢步金森倉庫與八幡坂（元町教堂群看時間，最晚16:10動身）","sight",145,245],
["16:30","函館山纜車 山麓站","購票搭乘纜車上山（日落時間約16:55）","transit",115,225],
["17:00","函館山展望台","絕美魔幻藍調與百萬夜景","view",105,205],
["19:00","纜車下山","返回市區結束首日行程，假如有體力再去函館車站買大沼公園車票","transit",140,250]]},
{date:"10/15（四）",name:"楓紅國定公園與星形城郭",sub:"函館朝市 → 大沼公園賞楓 → 村上海膽 → 五稜郭公園 → 羊肉大餐",p:[
["06:30","函館朝市","享用美味海鮮","food",230,315],
["08:23","JR 函館本線","搭乘電車前往大沼公園（08:23-09:10）","transit",210,250],
["09:10","大沼國定公園","漫步「島巡之路」賞楓，有空再去「大島之路」看萬聖節南瓜；車站旁「沼之家」買手工大沼糰子","nature",190,150],
["11:30","大沼公園站","返回月台準備搭車","transit",190,150],
["12:20","JR 函館本線","搭乘電車返回函館站（12:20-13:05）、函館戀草莓西式點心店買布丁（消耗2點）","transit",210,250],
["13:05","村上海膽 (Uni Murakami)","午餐：無添加海膽丼或去五稜郭吃函太郎","food",225,315],
["14:30","市電移動","搭乘市電返回「五稜郭公園前站」","transit",250,335],
["15:00","五稜郭公園 & 五稜郭塔(16:20登塔)","登塔俯瞰楓紅星形城郭，護城河畔散步","view",295,330],
["17:30","成吉思汗羊肉","晚餐：享用羊肉大餐","food",275,355]]},
{date:"10/16（五）",name:"函館 → 札幌・市區景點",sub:"函館機場 → 丘珠機場 → 札幌 → 藻岩山",p:[
["06:20","函館機場","前往機場","airport",240,395],
["07:50","JAL 國內線","函館 → 札幌丘珠機場","flight",345,255],
["09:00","搭交通車前往JR東日本札幌華盛頓酒店","Check-in／寄放行李、拿收據","hotel",385,205],
["09:50","北海道大學","銀杏大道與古老校園","park",390,175],
["12:00","敘敘苑 札幌駅前店","午餐","food",415,220],
["13:00","大丸百貨／JR Tower","札幌站商圈逛街","shop",425,235],
["14:30","北海道神宮","參拜、御守、六花亭判官樣","sight",365,150],
["17:30","藻岩山展望台","纜車＋札幌夜景","view",345,125]]},
{date:"10/17（六）",name:"札幌地標・美瑛青池一日遊",sub:"札幌市中心 → 美瑛／富良野 → 狸小路",p:[
["08:45","札幌市時計台","外觀拍照","sight",430,215],
["09:00","札幌電視塔","展望台俯瞰大通公園","view",435,240],
["10:00","Donguri Odori","奶油玉米麵包、明太子馬鈴薯鹽可頌","food",430,245],
["10:30","大通公園集合點","步行前往旅行社集合點","transit",420,250],
["11:00","美瑛・白金青池","旅行社一日遊核心景點","nature",530,135],
["—","白鬚瀑布／富良野","依旅行社當日路線停留","nature",500,170],
["21:30","大通公園解散","返回札幌市中心","transit",420,250],
["21:45","狸小路商店街","夜逛、宵夜、夜パフェ","shop",405,285],
["22:30","MEGA 唐吉訶德 狸小路本店","藥妝與伴手禮","shop",395,300],
["—","元祖拉麵橫丁／狸小路周邊","札幌味噌拉麵","food",405,300]]},
{date:"10/18（日）",name:"小樽浪漫一日遊",sub:"札幌 → 小樽運河 → 堺町通 → 天狗山 → 札幌",p:[
["09:30","JR 札幌站","快速 Airport 往小樽；可留意右側海景","transit",420,220],
["10:30","小樽運河","漫步拍照","sight",325,105],
["11:15","籔半蕎麥麵","午餐","food",315,125],
["12:30","堺町通商店街","北一硝子、音樂盒堂、LeTAO、六花亭、北菓樓","shop",300,155],
["17:30","天狗山纜車","公車前往；《First Love 初戀》取景地","view",245,70],
["20:30","禪 壽喜燒","返回札幌後晚餐","food",415,220]]},
{date:"10/19（一）",name:"返程",sub:"札幌 → 新千歲機場 → 台灣",p:[
["08:00","JR 札幌站","快速 Airport 直達新千歲機場","transit",420,220],
["09:00","新千歲機場","哆啦A夢、Royce’、拉麵道場、伴手禮","airport",470,335],
["12:05","飛往台灣","返程航班起飛","flight",470,335]]}
];
const type={airport:"機場",hotel:"住宿",food:"美食",view:"景觀",sight:"景點",park:"公園",shop:"購物",nature:"自然",transit:"交通",flight:"航班"};
const color={food:"#c49a6c",view:"#7d91b8",nature:"#8aa6a0",shop:"#b58ca8"};
let day=0,sel=0;
const $=id=>document.getElementById(id);
function render(){
 const d=days[day]; $("title").textContent=d.date+" "+d.name;$("sub").textContent=d.sub;$("summary").textContent=d.p.length+" 個行程節點";
 $("tabs").innerHTML=days.map((x,i)=>`<button class="${i===day?"active":""}" onclick="setDay(${i})"><small>${x.date}</small><strong>${x.name}</strong></button>`).join("");
 $("routes").innerHTML=d.p.slice(0,-1).map((p,i)=>`<line class="route" x1="${p[4]}" y1="${p[5]}" x2="${d.p[i+1][4]}" y2="${d.p[i+1][5]}"/>`).join("");
 $("markers").innerHTML=d.p.map((p,i)=>`<g class="marker" onclick="selectStop(${i})"><circle cx="${p[4]}" cy="${p[5]}" r="${i===sel?10:8}" fill="${color[p[3]]||"#64756e"}"/><text x="${p[4]+13}" y="${p[5]+4}">${p[1]}</text></g>`).join("");
 $("timeline").innerHTML=d.p.map((p,i)=>`<button class="stop ${i===sel?"active":""}" onclick="selectStop(${i})"><div class="time">${p[0]}</div><div class="dot"></div><div><strong>${p[1]}</strong><span>${p[2]}</span></div></button>`).join("");
 const used=[...new Set(d.p.map(p=>p[3]))];$("legend").innerHTML=used.map(x=>`<span class="pill">${type[x]||x}</span>`).join("");
 selectStop(Math.min(sel,d.p.length-1),false);
}
function selectStop(i,scroll=true){sel=i;const p=days[day].p[i];$("detail").innerHTML=`<strong>${p[0]} ${p[1]}</strong><br>${p[2]}<br><span style="color:#89938f">分類：${type[p[3]]||p[3]}</span>`;document.querySelectorAll(".stop").forEach((x,j)=>x.classList.toggle("active",j===i));if(scroll)document.querySelectorAll(".stop")[i]?.scrollIntoView({behavior:"smooth",block:"nearest"});renderMarkersOnly()}
function renderMarkersOnly(){document.querySelectorAll(".marker circle").forEach((c,i)=>c.setAttribute("r",i===sel?10:8))}
function setDay(i){day=i;sel=0;render()}
render();
</script>
</body>
</html>
